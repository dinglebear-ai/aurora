name: Public synthetics

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions: {}

concurrency:
  group: aurora-public-synthetics
  cancel-in-progress: true

jobs:
  public-path:
    # Self-hosted (tootie runner farm): residential egress is not challenged by
    # Cloudflare, unlike GitHub-hosted Azure IPs (see ops/synthetics-cloudflare.md).
    runs-on: ci-pool-residential-egress
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check landing, content negotiation, deployed-revision registry checksum, revision, and TLS
        env:
          AURORA_PUBLIC_URL: ${{ vars.AURORA_PUBLIC_URL || 'https://aurora.tootie.tv' }}
          AURORA_TLS_MIN_SECONDS: ${{ vars.AURORA_TLS_MIN_SECONDS || '1209600' }}
        run: ops/synthetic-check.sh
      - name: Check the co-hosted dinglebear tenant
        env:
          AURORA_PUBLIC_URL: ${{ vars.AURORA_TENANT_URL || 'https://dinglebear.ai' }}
          AURORA_TLS_MIN_SECONDS: ${{ vars.AURORA_TLS_MIN_SECONDS || '1209600' }}
        run: ops/synthetic-check.sh
