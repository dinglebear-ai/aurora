name: Public synthetics

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: aurora-public-synthetics
  cancel-in-progress: false

jobs:
  public-path:
    uses: dinglebear-ai/workflows/.github/workflows/synthetic-check.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      command: >-
        AURORA_PUBLIC_URL="${{ vars.AURORA_PUBLIC_URL || 'https://aurora.tootie.tv' }}"
        AURORA_TLS_MIN_SECONDS="${{ vars.AURORA_TLS_MIN_SECONDS || '1209600' }}"
        ops/synthetic-check.sh &&
        AURORA_PUBLIC_URL="${{ vars.AURORA_TENANT_URL || 'https://dinglebear.ai' }}"
        AURORA_TLS_MIN_SECONDS="${{ vars.AURORA_TLS_MIN_SECONDS || '1209600' }}"
        ops/synthetic-check.sh
