name: Release artifacts

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: aurora-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  web:
    permissions:
      contents: read
    uses: dinglebear-ai/workflows/.github/workflows/hosted-web-release.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      node-version: "24"
      package-cache: pnpm
      pnpm-version: "10.33.2"
      cache-dependency-path: pnpm-lock.yaml
      install-command: pnpm install --frozen-lockfile
      coverage-command: pnpm run test:coverage
      build-command: >-
        AURORA_BUILD_SHA=${{ github.sha }}
        pnpm run build
      performance-command: pnpm run performance:check
      e2e-command: pnpm run test:e2e
      artifact-name: aurora-web-${{ github.event.release.tag_name }}
      artifact-path: .next/standalone
      diagnostic-path: |
        playwright-report/
        test-results/
      timeout-minutes: 60

  android:
    permissions:
      contents: read
    uses: dinglebear-ai/workflows/.github/workflows/hosted-android-release.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      java-version: "21"
      working-directory: android
      setup-command: >-
        corepack enable &&
        corepack prepare pnpm@10.33.2 --activate &&
        pnpm --dir .. install --frozen-lockfile
      release-command: ./gradlew androidCheck --no-daemon
      device-command: |
        if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
        ./gradlew androidManagedDeviceCheck --no-daemon
        ../ops/smoke-android-composite.sh
      artifact-name: aurora-android-${{ github.event.release.tag_name }}
      artifact-path: android/**/build/outputs/**
      report-path: android/**/build/reports/**
      timeout-minutes: 90

  container:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      image: ghcr.io/${{ github.repository }}
      release-tag: ${{ github.event.release.tag_name }}
      build-args: AURORA_BUILD_SHA=${{ github.sha }}
      smoke-command: |
        set -euo pipefail
        name="aurora-release-smoke-${GITHUB_RUN_ID}"
        trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
        docker run -d --name "$name" -p 127.0.0.1::3000 "$IMAGE_REF" >/dev/null
        port="$(docker port "$name" 3000/tcp | awk -F: '{print $NF}')"
        for _ in {1..45}; do
          curl --fail --silent "http://127.0.0.1:${port}/" >/dev/null && exit 0
          sleep 2
        done
        docker logs "$name"
        exit 1
      cache-scope: aurora-release
      timeout-minutes: 60
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
