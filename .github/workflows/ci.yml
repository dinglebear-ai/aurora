name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      profile: node
      implementation-ref: 542ea7b7e5ca2d4e21f3277bfcf158584fee90ec

  # Required by branch ruleset as literal status-check context "Workflow and
  # dependency policy" — a reusable workflow-call job always reports as
  # "<caller> / <called-job>", so this stays an inline job rather than
  # delegating to fast-ops.yml.
  policy:
    name: Workflow and dependency policy
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Require immutable action references
        run: ops/check-action-pins.sh
      - name: Validate workflow syntax
        run: actionlint
      - name: Validate deployment topology
        run: ops/check-production-topology.sh
      - name: Validate operations shell
        run: shellcheck ops/*.sh
      - name: Validate generated skill documentation
        run: node scripts/sync-agent-skill.mjs --check && ops/check-skill-sync.sh

  gradle-wrapper:
    name: Gradle wrapper
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

  dependencies:
    name: OSV dependency scan
    runs-on: [self-hosted, ci-pool-typescript]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  # Required by branch ruleset as literal status-check context "Web,
  # registry, and standalone" — kept inline (not fast-pnpm.yml) both for the
  # exact context-name match and because fast-pnpm.yml's build-command hook
  # runs after its contract-command hook, which would build *after*
  # audit:standalone instead of before it.
  web:
    name: Web, registry, and standalone
    runs-on: [self-hosted, ci-pool-typescript]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', 'proxy.ts') }}
          restore-keys: nextjs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - run: pnpm run lint
      - run: pnpm run audit:composition
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:unit
      - run: pnpm run test:coverage
      - name: Build the tested revision
        env:
          AURORA_BUILD_SHA: ${{ github.sha }}
        run: pnpm run build
      - name: Enforce production client JavaScript budgets
        run: pnpm run performance:check
      - name: Install Playwright Chromium, Firefox, and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Cross-browser, mobile, and strict Storybook accessibility contracts
        run: pnpm run test:e2e
      - run: pnpm run refs:check
      - run: pnpm run audit:standalone
      - run: pnpm run registry:check
      - run: pnpm run registry:validate
      - run: pnpm run registry:graph
      - run: pnpm run registry:smoke
      - run: pnpm run gallery:check
      - run: pnpm run catalog:check
      - run: pnpm run tokens:generate
      - name: Generated artifacts are committed
        run: git diff --exit-code

  # Required by branch ruleset as literal status-check context "Android app
  # and library variants". Runs on GitHub-hosted ubuntu-latest (unchanged
  # from the pre-migration job): the self-hosted ci-pool-* fleet has no
  # verified Android SDK/KVM-capable pool, and the fleet's own hosted Android
  # release workflow (hosted-android-release.yml) also targets ubuntu-24.04
  # rather than a self-hosted label for the same reason.
  android:
    name: Android app and library variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Gate all app/library variants, release lint/package, wrapper, and Roborazzi goldens
        run: ./gradlew androidCheck --no-daemon
        working-directory: android
      - name: Run Android managed-device instrumentation smoke
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          ./gradlew androidManagedDeviceCheck --no-daemon
        working-directory: android
      - name: Smoke external composite-build consumption
        run: ops/smoke-android-composite.sh

  gate:
    name: CI
    if: always()
    needs: [contract, policy, gradle-wrapper, dependencies, web, android]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 2
    steps:
      - name: Require every fast lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success success"
