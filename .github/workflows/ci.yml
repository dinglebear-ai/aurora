name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      profile: node
      implementation-ref: 542ea7b7e5ca2d4e21f3277bfcf158584fee90ec

  policy:
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      shell-globs: "ops/*.sh"
      policy-command: >-
        ops/check-action-pins.sh &&
        ops/check-production-topology.sh &&
        node scripts/sync-agent-skill.mjs --check &&
        ops/check-skill-sync.sh

  gradle-wrapper:
    name: Gradle wrapper
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

  dependencies:
    name: OSV dependency scan
    runs-on: [self-hosted, ci-pool-typescript]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  web:
    uses: dinglebear-ai/workflows/.github/workflows/fast-pnpm.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      node-version: "24"
      pnpm-version: "10.33.2"
      audit-command: pnpm audit --audit-level high
      lint-command: pnpm run lint
      typecheck-command: pnpm exec tsc --noEmit
      test-command: pnpm run test:coverage
      contract-command: >-
        pnpm run audit:composition &&
        pnpm run refs:check &&
        pnpm run audit:standalone &&
        pnpm run registry:check &&
        pnpm run registry:validate &&
        pnpm run registry:graph &&
        pnpm run registry:smoke &&
        pnpm run gallery:check &&
        pnpm run catalog:check &&
        pnpm run tokens:generate &&
        git diff --exit-code
      timeout-minutes: 25

  gate:
    name: CI
    if: always()
    needs: [contract, policy, gradle-wrapper, dependencies, web]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 2
    steps:
      - name: Require every fast lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success"
