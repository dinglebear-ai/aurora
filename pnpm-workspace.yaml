packages:
  - "apps/*"

engineStrict: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - better-sqlite3
  - msw
  - sharp
  - unrs-resolver
# pnpm v10 reads overrides / onlyBuiltDependencies from here, NOT the "pnpm"
# field in package.json (that field is silently ignored as of pnpm 10). See
# https://pnpm.io/settings. Migrated from package.json on 2026-05-31.
overrides:
  "@babel/core@<7.29.6": "7.29.6"
  "@eslint/config-array>minimatch": "10.2.5"
  # @eslint/eslintrc uses only the long-lived Minimatch class API; move it
  # off minimatch 3 / brace-expansion 1 without upgrading ESLint past plugin support.
  "@eslint/eslintrc>minimatch": "10.2.5"
  # transitive dev/build-tooling vulns pulled via shadcn → MCP SDK, and sharp
  "@hono/node-server@<2.0.10": "2.0.10"
  "@types/react": "19.1.2"
  "@types/react-dom": "19.1.2"
  "ajv@<6.14.0": "6.15.0"
  # GHSA-mh99-v99m-4gvg; keep the override within the compatible 5.x API
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  "diff@>=6.0.0 <8.0.3": "8.0.3"
  "eslint-plugin-import>minimatch": "10.2.5"
  "eslint-plugin-jsx-a11y>minimatch": "10.2.5"
  "eslint-plugin-react>minimatch": "10.2.5"
  "eslint>minimatch": "10.2.5"
  "fast-uri@<3.1.5": "3.1.5"
  "flatted@<=3.4.1": "3.4.2"
  # GHSA-88fw-hqm2-52qc / hvrm / w62v / xgm2 — hono vulns via shadcn's MCP SDK dependency (dev/build tooling only)
  "hono@<4.12.27": "4.12.27"
  # GHSA-mwp4-54f8-5fhr — Address4 octal/decimal leading-zero confusion (SSRF), via shadcn's MCP SDK
  "ip-address@<=10.3.0": "10.3.1"
  "js-yaml@<4.3.0": "4.3.0"
  "path-to-regexp@>=8.0.0 <8.4.0": "8.4.0"
  "picomatch@<3": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  # GHSA-r28c-9q8g-f849 and earlier source-map advisories
  "postcss@<8.5.18": "8.5.19"
  "qs@<=6.15.1": "6.15.2"
  "sharp@<0.35.0": "0.35.0"
  # GHSA-7c78-jf6q-g5cm — tmp path traversal via non-string prefix/postfix/template
  "tmp@<0.2.7": "0.2.7"
  # GHSA-4cwx-7wf7-3272 — undici cache-directive parse crash / info disclosure, via shadcn
  "undici@<7.29.0": "7.29.0"
patchedDependencies:
  eslint-plugin-import@2.32.0: patches/eslint-plugin-import@2.32.0.patch
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
  eslint-plugin-react@7.37.5: patches/eslint-plugin-react@7.37.5.patch
